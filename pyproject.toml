[project]
name = "django-starter-api"
version = "0.1.0"
description = "Headless Django + Django-Ninja starter for pure API development"
authors = [
    {name = "DealiAxy", email = "dealiaxy@gmail.com"},
]
dependencies = [
    "django[argon2]>=6.0",
    "django-ninja>=1.5.3",
    "django-cors-headers>=4.9.0",
    "orjson>=3.11.5",
    "pydantic>=2.12.5",
    "pyjwt>=2.10.1",
    "django-starter-core>=0.1.0",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["src"]

[tool.uv.sources]
django-starter-core = { path = "../django-starter-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/apps", "src/config"]
